{% extends "gym/base.html" %}
{% block content %}
<div class="card shadow-sm col-md-6 mx-auto"><div class="card-body p-4">
  <h5>Delete "{{ obj }}"?</h5>
  <p class="text-muted">This cannot be undone.</p>
  <form method="post">{% csrf_token %}
    <button class="btn btn-danger">Yes, delete</button>
    <a href="{% url back %}" class="btn btn-outline-secondary">Cancel</a>
  </form>
</div></div>
{% endblock %}

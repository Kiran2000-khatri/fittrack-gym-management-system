<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FitTrack{% endblock %} | FitTrack Gym</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{background:#f4f6f9}
    .navbar{background:#111827}
    .stat{border-left:4px solid #f97316}
    .bar{background:#f97316;height:14px;border-radius:4px}
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{% url 'dashboard' %}">&#127947; FitTrack</a>
    {% if user.is_authenticated %}
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="{% url 'member_list' %}">Members</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'plan_list' %}">Plans</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'membership_list' %}">Memberships</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'payment_list' %}">Payments</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'attendance' %}">Attendance</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'trainer_list' %}">Trainers</a></li>
      </ul>
      <form method="post" action="{% url 'logout' %}" class="d-flex">{% csrf_token %}
        <span class="navbar-text me-3">{{ user.username }}</span>
        <button class="btn btn-sm btn-outline-light">Logout</button>
      </form>
    </div>
    {% endif %}
  </div>
</nav>
<div class="container pb-5">
  {% for m in messages %}
    <div class="alert alert-{% if m.tags == 'error' %}danger{% else %}{{ m.tags }}{% endif %} alert-dismissible fade show">{{ m }}<button class="btn-close" data-bs-dismiss="alert"></button></div>
  {% endfor %}
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
